spring.application.name=studyapi
spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATA_USER}
spring.datasource.password=${DATA_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080
# MAXIMO DE PESSOAS FAZENDO A MESMA REQUISIÇÃO
spring.datasource.hikari.maximum-pool-size=10

# MAMIXO DE TEMPO QUE A PESSOA PODE FICAR NA FILA ESPERANDO PARA FAZER REQUIÇÃO 30SEGUNDOS
spring.datasource.hikari.connection-timeout=30000

