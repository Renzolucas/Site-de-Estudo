spring.application.name=studyapi
spring.config.import=optional:file:.env[.properties]


# DataSource MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/studyos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.open-in-view=false

# JWT Security Configuration
studyos.jwt.secret=${JWT_SECRET:}
studyos.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# Server Configuration
server.port=8080
# MAXIMO DE PESSOAS FAZENDO A MESMA REQUISIÇÃO
spring.datasource.hikari.maximum-pool-size=10

# MAMIXO DE TEMPO QUE A PESSOA PODE FICAR NA FILA ESPERANDO PARA FAZER REQUIÇÃO 30SEGUNDOS
spring.datasource.hikari.connection-timeout=30000

# Recuperação de Senha (Modo Demonstração Acadêmica)
# ATENÇÃO: Em ambiente de produção real, deve ser alterado para false para não expor o demoCode no payload JSON.
studyos.recovery.demo-mode=true

# Seed de contas de demonstração (deve ser false em produção)
studyos.demo-seed=true



